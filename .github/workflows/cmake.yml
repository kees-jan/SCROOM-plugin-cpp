name: CMake

on: [ push, pull_request ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo

  CCACHE_BASEDIR: ${{github.workspace}}
  CCACHE_DIR: ${{github.workspace}}/.ccache
  CCACHE_COMPRESS: true
  CCACHE_COMPRESSLEVEL: 6

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-24.04 ]
        type: [ RelWithDebInfo, Debug ]
      fail-fast: false
    env:
      BUILD_TYPE: ${{ matrix.type }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: ccache cache files
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ${{ matrix.os }}-${{ env.BUILD_TYPE }}-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ matrix.os }}-${{ env.BUILD_TYPE }}-ccache-

      - name: Update Ubuntu package repos
        run: sudo apt-get update

      - name: Install Ubuntu Dependencies
        run: >
          sudo apt-get  -yq --no-install-suggests --no-install-recommends install 
          build-essential
          ccache 
          doxygen 
          git 
          google-mock 
          graphviz 
          libboost-dev 
          libboost-filesystem-dev 
          libboost-program-options-dev 
          libboost-system-dev 
          libboost-thread-dev 
          libc6-dev
          libcairo2-dev 
          libglib2.0-dev 
          libgtest-dev 
          libgtk-3-dev 
          libtiff5-dev 
          ninja-build
          pkg-config 
          python3-pip 

      - name: Configure CMake
        run: cmake -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      - name: Build
        # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: xvfb-run ctest -C ${{env.BUILD_TYPE}} -j2 --output-on-failure

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Log version numbers
        run: >
          echo CPP: && git describe --tags && echo Tags: && git tag -l &&
          echo "" &&
          cd scroom && echo Scroom: && git describe && echo Tags: && git tag -l

      - name: Install Pacman packages
        run: >
          build_scripts\github\msysdo pacman --sync --noconfirm --needed
          git
          make
          mingw-w64-x86_64-boost
          mingw-w64-x86_64-dlfcn
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-glade
          mingw-w64-x86_64-gtk3
          mingw-w64-x86_64-toolchain
          zip
          mingw64/mingw-w64-x86_64-cmake
          mingw64/mingw-w64-x86_64-python
          mingw64/mingw-w64-x86_64-python-pip

      - name: Build
        run: >
          build_scripts\github\mingwdo
          build_scripts/github/build-cmake-mingw

      - uses: actions/upload-artifact@v6
        with:
          name: Sources
          path: ScroomCPPPlugins-*Source.tar.gz

      - uses: actions/upload-artifact@v6
        with:
          name: Windows-portable-executable
          path: scroom-win-*.zip
